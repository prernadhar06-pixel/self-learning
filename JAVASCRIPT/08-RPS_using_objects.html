<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    
    <div class="heading"><h1><b>Rock . Paper . Scissors</b></h1></div>
    <div class="button-container">
    <button id="button1" onclick="
    playGame('rock');
    ">Rock
    </button>


    <button id="button2" onclick="
    playGame('paper');
    ">Paper</button>


    <button id="button3" onclick="
    playGame('scissors'); ">Scissors</button>

    <button id="button4" onclick="
    resetScore();
    ">Reset score</button>
    </div>
    
    <script>
        // const score ={ 
        //     wins: 0,
        //     losses: 0,
        //     ties: 0,
        // }; //the scope is outside the function because we need to update the vale every time a move is played

        const score = JSON.parse(localStorage.getItem('score')) || {
                wins: 0,
                losses: 0,
                ties: 0
            };  //how default operator works- if the left side is truthy (we hv a score). if left side is falsy (if score is null), then use the right side as a default value. does the same work as the if statement commented after this fraction of code. simplifies code.

        /* if(!score) {
            score = {
                wins: 0,
                losses: 0,
                ties: 0
            };
        } */

            /* null vs undefined (falsy values, both represents that something doesnt have a value) . we use null when we intentionally want something to be empty. for example if a parameter has a default value. if the parameter is undefined, it'll use the default value. but if we use null, it wont use default value- it'll use null. */


        //console.log(localStorage.getItem('message'));
        console.log(score); //this is a string, convert back ti an object, using parse method

        function  playGame(playerMove) {
            const computerMove= pickComputerMove();
            let result = '';

            if (playerMove==='rock'){
                if(computerMove=='rock') {
                    result = 'tie';
                }else if(computerMove=='paper') {
                    result='you lose';
                }else if(computerMove=='scissors') {
                    result='you win';
                }
            }else if (playerMove==='paper'){
                if(computerMove=='rock'){
                    result='you win';
                }else if(computerMove=='paper'){
                    result='tie';
                }else if(computerMove=='scissors'){
                    result='you lose';
                }
            }
            else{
                if(computerMove=='rock'){
                    result='you lose';
                }else if(computerMove=='paper') {
                    result='you win';
                }else if(computerMove=='scissors') {
                    result='tie';
                }
            }
            
            if(result ==='you win'){
                score.wins += 1;
            }else if(result ==='you lose'){ // = - assigns value(assignment operator), == - compares (comparison operator), === - compares type also
                score.losses += 1;
            }else if (result ==='tie'){
                score.ties += 1;
            }
            // console.log(score.wins);
            // console.log(score.losses);
            // console.log(score.ties);

            /*localStorage.setItem('message', 'hello');  //local strogae only supports strings
            //hello is the information saved*/
            //only supports strings, convert object to strings
            localStorage.setItem('score', JSON.stringify(score));

            alert(`you picked ${playerMove}, computer picked ${computerMove}. ${result} 
Wins: ${score.wins}, losses: ${score.losses}, ties: ${score.ties}`); //template string has a feature where inside the strng if you simply press enter, the output string also transitions to the next line
                }
        function pickComputerMove() {
            const randomNo = Math.random();
            let computerMove ='';   
            
            if(randomNo<0.33 && randomNo>=0){
                computerMove = 'rock';
            }else if(randomNo<0.66 && randomNo>=0.33){
                computerMove = 'paper';
            }else{
                computerMove = 'scissors';
            }
            return computerMove;
        };

        function resetScore(){
            score.wins = 0,
            score.losses = 0,
            score.ties = 0,
            localStorage.removeItem('score'); // this removes everything from local strorage when the page loads(top most get function), and gives us null. any change to a null value gives us an error
        }

    </script>
</body>
</html>
